name: Deploy careers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: njik-careers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP
        run: php -l careers.php

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy main
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=config.local.php \
            --exclude=error_log \
            --exclude=smtp_debug.log \
            --exclude=uploads/cv \
            -czf - . | ssh careers-deploy@"$DEPLOY_HOST"
